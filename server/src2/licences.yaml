# Licences policy definition for convaudio
allowed:
  - "MIT"
  - "Apache-2.0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "ISC"
  - "PSF-2.0"
  - "N/A" # Stub / internal test fixtures

allowed_with_attribution:
  - "CC-BY-4.0"

denied_patterns:
  - "*-NC*"
  - "*non-commercial*"
  - "*research-only*"
  - "BSD-4-Clause"
  - "GPL*"
  - "LGPL*"
  - "AGPL*"
  - "UNKNOWN"
  - "UNRESOLVED"

# Approved components with explicit code & weight licenses
