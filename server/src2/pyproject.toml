[project]
name = "convaudio"
version = "0.1.0"
description = "Batch audio-analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.0",
    "speechbrain>=1.1.0",
    "torchaudio>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "jsonschema>=4.18.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
convaudio = "convaudio.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["convaudio*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
